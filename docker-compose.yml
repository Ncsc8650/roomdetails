services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: asset_command
      POSTGRES_USER: asset_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asset_admin -d asset_command"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
